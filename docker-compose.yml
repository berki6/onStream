services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: onstream
      POSTGRES_PASSWORD: onstream
      POSTGRES_DB: onstream
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onstream -d onstream"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/onstream || true;
      mc anonymous set download local/onstream || true;
      exit 0;
      "

  api:
    build: .
    command: ["api"]
    env_file:
      - .env.docker
    ports:
      - "8000:8000"
    volumes:
      - media_data:/app/data
      - live_data:/app/data/live
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully

  mediamtx:
    image: bluenviron/mediamtx:latest
    ports:
      - "1935:1935"
      - "8888:8888"
      - "9997:9997"
    volumes:
      - ./configs/mediamtx.yml:/mediamtx.yml:ro
      - live_data:/hls
    depends_on:
      - api

  worker:
    build: .
    command: ["worker"]
    env_file:
      - .env.docker
    volumes:
      - media_data:/app/data
      - live_data:/app/data/live
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
      api:
        condition: service_started

  worker-ai:
    profiles: ["ai"]
    build: .
    env_file:
      - .env.docker
    environment:
      AI_ENABLED: "true"
      AI_CAPTIONS_PROVIDER: faster_whisper
      AI_EMBEDDINGS_PROVIDER: sentence_transformers
      WHISPER_MODEL: tiny
      EMBEDDING_MODEL: all-MiniLM-L6-v2
    volumes:
      - media_data:/app/data
      - live_data:/app/data/live
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
      api:
        condition: service_started
    # Install AI extras at start (image keeps core deps only)
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        pip install -q -r requirements-ai.txt &&
        ./scripts/docker-entrypoint.sh worker

volumes:
  postgres_data:
  minio_data:
  media_data:
  live_data:
