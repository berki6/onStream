services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: onstream
      POSTGRES_PASSWORD: onstream
      POSTGRES_DB: onstream
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onstream -d onstream"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/onstream || true;
      mc anonymous set download local/onstream || true;
      exit 0;
      "

  api:
    build: .
    command: ["api"]
    env_file:
      - .env.docker
    ports:
      - "8000:8000"
    volumes:
      - media_data:/app/data
      - live_data:/app/data/live
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully

  mediamtx:
    image: bluenviron/mediamtx:latest
    ports:
      - "1935:1935"
      - "8888:8888"
      - "8889:8889"
      - "8189:8189/udp"
      - "9997:9997"
    volumes:
      - ./configs/mediamtx.yml:/mediamtx.yml:ro
      - live_data:/hls
    depends_on:
      - api

  worker:
    build: .
    command: ["worker"]
    env_file:
      - .env.docker
    volumes:
      - media_data:/app/data
      - live_data:/app/data/live
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
      api:
        condition: service_started

  worker-ai:
    profiles: ["ai"]
    build: .
    env_file:
      - .env.docker
    environment:
      AI_ENABLED: "true"
      AI_CAPTIONS_PROVIDER: faster_whisper
      AI_EMBEDDINGS_PROVIDER: sentence_transformers
      WHISPER_MODEL: tiny
      EMBEDDING_MODEL: all-MiniLM-L6-v2
    volumes:
      - media_data:/app/data
      - live_data:/app/data/live
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
      api:
        condition: service_started
    # Install AI extras at start (image keeps core deps only)
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        pip install -q -r requirements-ai.txt &&
        ./scripts/docker-entrypoint.sh worker

  worker-gpu:
    profiles: ["gpu"]
    build:
      context: .
      dockerfile: Dockerfile.gpu
    command: ["worker"]
    env_file:
      - .env.docker
    environment:
      FFMPEG_HWACCEL: nvenc
    volumes:
      - media_data:/app/data
      - live_data:/app/data/live
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
      api:
        condition: service_started
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  coturn:
    profiles: ["turn"]
    image: coturn/coturn:latest
    network_mode: host
    environment:
      DETECT_EXTERNAL_IP: "yes"
    # Prefer docker-compose.turn.yml for port mappings when host network is unavailable.
    command:
      - "-n"
      - "--log-file=stdout"
      - "--listening-port=3478"
      - "--fingerprint"
      - "--lt-cred-mech"
      - "--user=onstream:onstreamturn"
      - "--realm=onstream.local"

  caddy:
    profiles: ["edge"]
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - mediamtx

  prometheus:
    profiles: ["obs"]
    image: prom/prometheus:v2.54.1
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    profiles: ["obs"]
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  minio_data:
  media_data:
  live_data:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
