<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OnStream · WHIP publish</title>
  <style>
    :root {
      --bg: #0f1419;
      --fg: #e8eef4;
      --accent: #3d9cf0;
      --muted: #8b9aab;
      --danger: #e85d5d;
      --ok: #3ecf8e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(ellipse at top, #1a2836 0%, var(--bg) 55%);
      color: var(--fg);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }
    h1 { font-weight: 600; letter-spacing: -0.02em; margin: 0 0 0.5rem; }
    p { color: var(--muted); margin: 0 0 1.25rem; max-width: 40rem; text-align: center; line-height: 1.45; }
    .panel {
      width: min(720px, 100%);
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    label { font-size: 0.85rem; color: var(--muted); }
    input {
      width: 100%;
      padding: 0.65rem 0.85rem;
      border: 1px solid #2a3a4a;
      border-radius: 6px;
      background: #121a22;
      color: var(--fg);
    }
    .row { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    button {
      padding: 0.65rem 1.1rem;
      border: none;
      border-radius: 6px;
      background: var(--accent);
      color: #041018;
      font-weight: 600;
      cursor: pointer;
    }
    button.ghost {
      background: transparent;
      color: var(--fg);
      border: 1px solid #2a3a4a;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    video {
      width: 100%;
      background: #000;
      border-radius: 8px;
      aspect-ratio: 16 / 9;
    }
    #status { min-height: 1.4rem; font-size: 0.9rem; color: var(--muted); }
    #status.ok { color: var(--ok); }
    #status.err { color: var(--danger); }
    #hint {
      padding: 0.85rem 1rem;
      border-radius: 8px;
      border: 1px solid #5a3a20;
      background: #24180e;
      color: #f0c24b;
      font-size: 0.9rem;
      line-height: 1.45;
      text-align: left;
    }
    #hint a { color: var(--accent); }
    code { color: var(--accent); }
  </style>
</head>
<body>
  <h1>Go Live · WHIP</h1>
  <p>
    Camera / mic → WebRTC WHIP → MediaMTX. The camera only works on a
    <strong>secure origin</strong> (<code>http://127.0.0.1</code> or HTTPS).
    Phone: install the lab CA, then open this page on <code>https://LAN</code>.
    PC: <code>http://127.0.0.1:8000</code> is already a secure origin.
  </p>
  <div class="panel">
    <div id="hint" hidden></div>
    <label for="whip">WHIP URL</label>
    <input id="whip" type="url" placeholder="http://127.0.0.1:8889/live/KEY/whip" autocomplete="off" />
    <video id="preview" playsinline muted autoplay></video>
    <div class="row">
      <button id="go" type="button">Go Live</button>
      <button id="stop" class="ghost" type="button" disabled>Stop</button>
    </div>
    <div id="status">Idle</div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const whipInput = document.getElementById("whip");
    const preview = document.getElementById("preview");
    const statusEl = document.getElementById("status");
    const hintEl = document.getElementById("hint");
    const goBtn = document.getElementById("go");
    const stopBtn = document.getElementById("stop");

    if (params.get("whip")) {
      whipInput.value = params.get("whip");
    }

    let pc = null;
    let media = null;
    let sessionUrl = null;

    function setStatus(text, kind) {
      statusEl.textContent = text;
      statusEl.className = kind || "";
    }

    function isLoopbackHost(hostname) {
      return hostname === "localhost" || hostname === "127.0.0.1";
    }

    function toLoopback(urlStr) {
      try {
        const u = new URL(urlStr, location.href);
        u.protocol = "http:";
        u.hostname = "127.0.0.1";
        u.port = "8000";
        const nested = u.searchParams.get("whip");
        if (nested) {
          const w = new URL(nested);
          w.protocol = "http:";
          w.hostname = "127.0.0.1";
          w.port = "8889";
          u.searchParams.set("whip", w.href);
        }
        return u.href;
      } catch {
        return urlStr;
      }
    }

    function caUrl() {
      return "http://" + location.hostname + "/lab/ca.crt";
    }

    function httpsPageUrl() {
      try {
        const u = new URL(location.href);
        u.protocol = "https:";
        if (u.port === "8000" || u.port === "80") u.port = "";
        return u.href;
      } catch {
        return location.href;
      }
    }

    function sameOrigin(urlStr) {
      try {
        return new URL(urlStr, location.href).origin === location.origin;
      } catch {
        return false;
      }
    }

    function cameraAvailable() {
      return Boolean(
        window.isSecureContext &&
          navigator.mediaDevices &&
          typeof navigator.mediaDevices.getUserMedia === "function"
      );
    }

    function showInsecureHint() {
      const page = toLoopback(location.href);
      const ca = caUrl();
      const httpsPage = httpsPageUrl();
      hintEl.hidden = false;
      if (isLoopbackHost(location.hostname)) {
        hintEl.innerHTML =
          "This origin is not a secure context. Open " +
          "<a href=\"" + page + "\">" + page + "</a> on this PC.";
        return;
      }
      hintEl.innerHTML =
        "Browsers block the camera on <code>http://</code> LAN. " +
        "<strong>Phone:</strong> 1) install the lab CA from " +
        "<a href=\"" + ca + "\">" + ca + "</a> " +
        "(iOS: Settings → General → VPN & Device Management → install, then " +
        "General → About → Certificate Trust Settings → Full Trust). " +
        "2) open <a href=\"" + httpsPage + "\">" + httpsPage + "</a>. " +
        "<strong>PC:</strong> <a href=\"" + page + "\">" + page + "</a> " +
        "(localhost is already a secure origin).";
    }

    async function postWhip(whipUrl, sdp) {
      if (sameOrigin(whipUrl)) {
        const res = await fetch(whipUrl, {
          method: "POST",
          headers: { "Content-Type": "application/sdp" },
          body: sdp,
        });
        const body = await res.text();
        const loc = res.headers.get("Location");
        return {
          status: res.status,
          sdp: body,
          session_url: loc ? new URL(loc, whipUrl).href : null,
          error: res.status === 201 ? null : body.slice(0, 200),
        };
      }
      const res = await fetch(
        "/demo/whip/session?target=" + encodeURIComponent(whipUrl),
        {
          method: "POST",
          headers: { "Content-Type": "application/sdp" },
          body: sdp,
        }
      );
      const payload = await res.json().catch(() => ({}));
      return {
        status: res.status,
        sdp: payload.sdp,
        session_url: payload.session_url || null,
        error: payload.error || payload.sdp || null,
      };
    }

    async function deleteWhipSession(url) {
      if (!url) return;
      if (sameOrigin(url)) {
        await fetch(url, { method: "DELETE" }).catch(() => {});
        return;
      }
      const q = "/demo/whip/session?target=" + encodeURIComponent(url);
      await fetch(q, { method: "DELETE" }).catch(() => {});
    }

    async function getMedia() {
      if (!cameraAvailable()) {
        showInsecureHint();
        throw new Error(
          "Camera API missing. Phone: install CA + HTTPS. PC: http://127.0.0.1:8000."
        );
      }
      try {
        return await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: true,
        });
      } catch {
        return await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      }
    }

    function waitIce(peer) {
      if (peer.iceGatheringState === "complete") return Promise.resolve();
      return new Promise((resolve) => {
        const check = () => {
          if (peer.iceGatheringState === "complete") {
            peer.removeEventListener("icegatheringstatechange", check);
            resolve();
          }
        };
        peer.addEventListener("icegatheringstatechange", check);
        setTimeout(resolve, 2500);
      });
    }

    async function stop() {
      try {
        if (sessionUrl) {
          await deleteWhipSession(sessionUrl);
        }
      } finally {
        sessionUrl = null;
        if (pc) {
          pc.close();
          pc = null;
        }
        if (media) {
          media.getTracks().forEach((t) => t.stop());
          media = null;
        }
        preview.srcObject = null;
        goBtn.disabled = false;
        stopBtn.disabled = true;
        setStatus("Stopped");
      }
    }

    if (!cameraAvailable()) {
      showInsecureHint();
      setStatus("Install the lab CA, then open the HTTPS link — or use localhost on this PC.", "err");
    }

    goBtn.addEventListener("click", async () => {
      const whipUrl = whipInput.value.trim();
      if (!whipUrl) {
        setStatus("WHIP URL required", "err");
        return;
      }
      goBtn.disabled = true;
      setStatus("Requesting camera…");
      try {
        media = await getMedia();
        preview.srcObject = media;
        pc = new RTCPeerConnection({
          iceServers: [{ urls: "stun:stun.l.google.com:19302" }],
        });
        media.getTracks().forEach((t) => pc.addTrack(t, media));
        if (window.RTCRtpSender && RTCRtpSender.getCapabilities) {
          const caps = RTCRtpSender.getCapabilities("video");
          if (caps && caps.codecs && caps.codecs.length) {
            const pref = caps.codecs.filter((c) => /H264/i.test(c.mimeType))
              .concat(caps.codecs.filter((c) => !/H264/i.test(c.mimeType)));
            pc.getTransceivers().forEach((t) => {
              if (
                t.sender &&
                t.sender.track &&
                t.sender.track.kind === "video" &&
                typeof t.setCodecPreferences === "function"
              ) {
                try { t.setCodecPreferences(pref); } catch (err) { /* ignore */ }
              }
            });
          }
        }
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        await waitIce(pc);
        setStatus("WHIP POST…");
        const posted = await postWhip(whipUrl, pc.localDescription.sdp);
        if (posted.status !== 201) {
          const msg = posted.error || "WHIP failed HTTP " + posted.status;
          throw new Error(String(msg).slice(0, 200));
        }
        sessionUrl = posted.session_url || null;
        await pc.setRemoteDescription({ type: "answer", sdp: posted.sdp });
        stopBtn.disabled = false;
        setStatus("Live — publishing to MediaMTX", "ok");
      } catch (e) {
        await stop();
        setStatus(e instanceof Error ? e.message : String(e), "err");
        goBtn.disabled = false;
      }
    });

    stopBtn.addEventListener("click", () => stop());
    window.addEventListener("beforeunload", () => {
      if (!sessionUrl) return;
      if (sameOrigin(sessionUrl)) {
        fetch(sessionUrl, { method: "DELETE", keepalive: true }).catch(() => {});
        return;
      }
      const q = "/demo/whip/session?target=" + encodeURIComponent(sessionUrl);
      navigator.sendBeacon?.(q);
    });
  </script>
</body>
</html>
