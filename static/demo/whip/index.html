<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OnStream · WHIP publish</title>
  <style>
    :root {
      --bg: #0f1419;
      --fg: #e8eef4;
      --accent: #3d9cf0;
      --muted: #8b9aab;
      --danger: #e85d5d;
      --ok: #3ecf8e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(ellipse at top, #1a2836 0%, var(--bg) 55%);
      color: var(--fg);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }
    h1 { font-weight: 600; letter-spacing: -0.02em; margin: 0 0 0.5rem; }
    p { color: var(--muted); margin: 0 0 1.25rem; max-width: 40rem; text-align: center; line-height: 1.45; }
    .panel {
      width: min(720px, 100%);
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    label { font-size: 0.85rem; color: var(--muted); }
    input {
      width: 100%;
      padding: 0.65rem 0.85rem;
      border: 1px solid #2a3a4a;
      border-radius: 6px;
      background: #121a22;
      color: var(--fg);
    }
    .row { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    button {
      padding: 0.65rem 1.1rem;
      border: none;
      border-radius: 6px;
      background: var(--accent);
      color: #041018;
      font-weight: 600;
      cursor: pointer;
    }
    button.ghost {
      background: transparent;
      color: var(--fg);
      border: 1px solid #2a3a4a;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    video {
      width: 100%;
      background: #000;
      border-radius: 8px;
      aspect-ratio: 16 / 9;
    }
    #status { min-height: 1.4rem; font-size: 0.9rem; color: var(--muted); }
    #status.ok { color: var(--ok); }
    #status.err { color: var(--danger); }
    #hint {
      padding: 0.85rem 1rem;
      border-radius: 8px;
      border: 1px solid #5a3a20;
      background: #24180e;
      color: #f0c24b;
      font-size: 0.9rem;
      line-height: 1.45;
      text-align: left;
    }
    #hint a { color: var(--accent); }
    code { color: var(--accent); }
  </style>
</head>
<body>
  <h1>Go Live · WHIP</h1>
  <p>
    Camera / mic → WebRTC WHIP → MediaMTX. The camera only works on a
    <strong>secure origin</strong> (<code>http://127.0.0.1</code> or HTTPS).
    Expo’s phone link is <code>http://LAN-IP</code>, which browsers block.
  </p>
  <div class="panel">
    <div id="hint" hidden></div>
    <label for="whip">WHIP URL</label>
    <input id="whip" type="url" placeholder="http://127.0.0.1:8889/live/KEY/whip" autocomplete="off" />
    <video id="preview" playsinline muted autoplay></video>
    <div class="row">
      <button id="go" type="button">Go Live</button>
      <button id="stop" class="ghost" type="button" disabled>Stop</button>
    </div>
    <div id="status">Idle</div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const whipInput = document.getElementById("whip");
    const preview = document.getElementById("preview");
    const statusEl = document.getElementById("status");
    const hintEl = document.getElementById("hint");
    const goBtn = document.getElementById("go");
    const stopBtn = document.getElementById("stop");

    if (params.get("whip")) {
      whipInput.value = params.get("whip");
    }

    let pc = null;
    let media = null;
    let sessionUrl = null;

    function setStatus(text, kind) {
      statusEl.textContent = text;
      statusEl.className = kind || "";
    }

    function toLoopback(urlStr) {
      try {
        const u = new URL(urlStr, location.href);
        if (u.hostname !== "localhost" && u.hostname !== "127.0.0.1") {
          u.hostname = "127.0.0.1";
        }
        const nested = u.searchParams.get("whip");
        if (nested) {
          const w = new URL(nested);
          if (w.hostname !== "localhost" && w.hostname !== "127.0.0.1") {
            w.hostname = "127.0.0.1";
            u.searchParams.set("whip", w.href);
          }
        }
        return u.href;
      } catch {
        return urlStr;
      }
    }

    function cameraAvailable() {
      return Boolean(
        window.isSecureContext &&
          navigator.mediaDevices &&
          typeof navigator.mediaDevices.getUserMedia === "function"
      );
    }

    function showInsecureHint() {
      const page = toLoopback(location.href);
      hintEl.hidden = false;
      hintEl.innerHTML =
        "Browsers block the camera on <code>http://LAN-IP</code> (that is what Expo opens). " +
        "On <strong>this PC</strong> open " +
        "<a href=\"" + page + "\">" + page + "</a> " +
        "then tap Go Live. Localhost is a secure origin.";
    }

    async function getMedia() {
      if (!cameraAvailable()) {
        showInsecureHint();
        throw new Error(
          "Camera API missing. Open this page via http://127.0.0.1:8000 on the PC."
        );
      }
      try {
        return await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: true,
        });
      } catch {
        return await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      }
    }

    function waitIce(peer) {
      if (peer.iceGatheringState === "complete") return Promise.resolve();
      return new Promise((resolve) => {
        const check = () => {
          if (peer.iceGatheringState === "complete") {
            peer.removeEventListener("icegatheringstatechange", check);
            resolve();
          }
        };
        peer.addEventListener("icegatheringstatechange", check);
        setTimeout(resolve, 2500);
      });
    }

    async function stop() {
      try {
        if (sessionUrl) {
          const q = "/demo/whip/session?target=" + encodeURIComponent(sessionUrl);
          await fetch(q, { method: "DELETE" }).catch(() => {});
        }
      } finally {
        sessionUrl = null;
        if (pc) {
          pc.close();
          pc = null;
        }
        if (media) {
          media.getTracks().forEach((t) => t.stop());
          media = null;
        }
        preview.srcObject = null;
        goBtn.disabled = false;
        stopBtn.disabled = true;
        setStatus("Stopped");
      }
    }

    if (!cameraAvailable()) {
      showInsecureHint();
      setStatus("Open the localhost link above on this PC to use the camera.", "err");
    }

    goBtn.addEventListener("click", async () => {
      const whipUrl = whipInput.value.trim();
      if (!whipUrl) {
        setStatus("WHIP URL required", "err");
        return;
      }
      goBtn.disabled = true;
      setStatus("Requesting camera…");
      try {
        media = await getMedia();
        preview.srcObject = media;
        pc = new RTCPeerConnection({
          iceServers: [{ urls: "stun:stun.l.google.com:19302" }],
        });
        media.getTracks().forEach((t) => pc.addTrack(t, media));
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        await waitIce(pc);
        setStatus("WHIP POST…");
        const res = await fetch(
          "/demo/whip/session?target=" + encodeURIComponent(whipUrl),
          {
            method: "POST",
            headers: { "Content-Type": "application/sdp" },
            body: pc.localDescription.sdp,
          }
        );
        const payload = await res.json().catch(() => ({}));
        if (res.status !== 201) {
          const msg =
            payload.error || payload.sdp || "WHIP failed HTTP " + res.status;
          throw new Error(String(msg).slice(0, 200));
        }
        sessionUrl = payload.session_url || null;
        await pc.setRemoteDescription({ type: "answer", sdp: payload.sdp });
        stopBtn.disabled = false;
        setStatus("Live — publishing to MediaMTX", "ok");
      } catch (e) {
        await stop();
        setStatus(e instanceof Error ? e.message : String(e), "err");
        goBtn.disabled = false;
      }
    });

    stopBtn.addEventListener("click", () => stop());
    window.addEventListener("beforeunload", () => {
      if (sessionUrl) {
        const q = "/demo/whip/session?target=" + encodeURIComponent(sessionUrl);
        navigator.sendBeacon?.(q);
      }
    });
  </script>
</body>
</html>
