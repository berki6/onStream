<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OnStream Demo Player</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
  <style>
    :root {
      --bg: #0f1419;
      --fg: #e8eef4;
      --accent: #3d9cf0;
      --muted: #8b9aab;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(ellipse at top, #1a2836 0%, var(--bg) 55%);
      color: var(--fg);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }
    h1 { font-weight: 600; letter-spacing: -0.02em; margin: 0 0 0.5rem; }
    p { color: var(--muted); margin: 0 0 1.5rem; max-width: 36rem; text-align: center; }
    .row { display: flex; gap: 0.5rem; width: min(720px, 100%); margin-bottom: 1rem; }
    input {
      flex: 1;
      padding: 0.65rem 0.85rem;
      border: 1px solid #2a3a4a;
      border-radius: 6px;
      background: #121a22;
      color: var(--fg);
    }
    button {
      padding: 0.65rem 1.1rem;
      border: none;
      border-radius: 6px;
      background: var(--accent);
      color: #041018;
      font-weight: 600;
      cursor: pointer;
    }
    video {
      width: min(720px, 100%);
      background: #000;
      border-radius: 8px;
      aspect-ratio: 16 / 9;
    }
  </style>
</head>
<body>
  <h1>OnStream</h1>
  <p>Paste an HLS master playlist URL (public or with <code>?token=</code>) and play.</p>
  <div class="row">
    <input id="url" type="url" placeholder="http://localhost:8000/v1/playback/{id}/master.m3u8" />
    <button id="play" type="button">Play</button>
  </div>
  <video id="video" controls playsinline></video>
  <script>
    const video = document.getElementById("video");
    const input = document.getElementById("url");
    let hls;
    document.getElementById("play").addEventListener("click", () => {
      const src = input.value.trim();
      if (!src) return;
      if (hls) { hls.destroy(); hls = null; }
      if (Hls.isSupported()) {
        hls = new Hls();
        hls.loadSource(src);
        hls.attachMedia(video);
      } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = src;
      } else {
        alert("HLS is not supported in this browser.");
      }
    });
  </script>
</body>
</html>
